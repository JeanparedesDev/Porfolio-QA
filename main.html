}

  ];
  return `
    <p class="hero-kicker text-[11px] font-semibold uppercase text-emerald-400/80">HABLEMOS</p>
<h1 class="font-display mt-3 text-3xl font-semibold text-white sm:text-4xl">Contacto</h1>
    <p class="mt-6 leading-relaxed text-zinc-300">Estoy abierto a oportunidades junior, prácticas y proyectos donde pueda seguir creciendo en QA.</p>
    <div class="mt-8 space-y-3">
      ${links.map(l => `
        <a href="${l.href}" target="_blank" rel="noreferrer" class="flex items-center gap-3 rounded-md border border-white/10 bg-white/[0.03] px-4 py-3 text-sm text-zinc-200 transition-all duration-200 hover:-translate-y-0.5 hover:border-emerald-400/40 hover:text-emerald-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-400">
          <i data-lucide="${l.icon}" class="h-4 w-4"></i>${l.label}
        </a>
      `).join("")}
    </div>
  `;
}

const RENDERERS = { about: renderAbout, resume: renderResume, portfolio: renderPortfolio, contact: renderContact };

function setActiveTab(tabId) {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    const isActive = btn.dataset.tab === tabId;
    btn.classList.toggle("text-white", isActive);
    btn.classList.toggle("text-zinc-500", !isActive);
    btn.querySelector(".tab-underline")?.remove();
    if (isActive) {
      const underline = document.createElement("span");
      underline.className = "tab-underline absolute inset-x-4 -bottom-px h-0.5 bg-emerald-400";
      btn.appendChild(underline);
    }
  });
  const panel = document.getElementById("tab-content");
  panel.classList.remove("tab-panel");
  void panel.offsetWidth; // reinicia la animación
  panel.classList.add("tab-panel");
  panel.innerHTML = RENDERERS[tabId]();
  if (window.lucide) lucide.createIcons();
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
  btn.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
    const buttons = [...document.querySelectorAll(".tab-btn")];
    const index = buttons.indexOf(btn);
    const next = event.key === "ArrowRight"
      ? buttons[(index + 1) % buttons.length]
      : buttons[(index - 1 + buttons.length) % buttons.length];
    next.focus();
    setActiveTab(next.dataset.tab);
  });
  btn.classList.add("text-zinc-500", "hover:text-zinc-300");
});
setActiveTab("about");
if (window.lucide) lucide.createIcons();

requestAnimationFrame(() => {
  const app = document.getElementById("app");
  app.classList.remove("opacity-0", "translate-y-3");
  app.classList.add("opacity-100", "translate-y-0");
});

// Fondo animado: red de nodos a la deriva, conectados cuando están cerca.
(function animateBackground() {
  const canvas = document.getElementById("bg-canvas");
  const ctx = canvas.getContext("2d");
  const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let particles = [];
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    canvas.width = canvas.offsetWidth * dpr;
    canvas.height = canvas.offsetHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function seed() {
    const w = canvas.offsetWidth, h = canvas.offsetHeight;
    const count = Math.min(55, Math.floor((w * h) / 24000));
    particles = Array.from({ length: count }, (_, i) => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: prefersReduced ? 0 : (Math.random() - 0.5) * 0.22,
      vy: prefersReduced ? 0 : (Math.random() - 0.5) * 0.22,
      r: Math.random() * 1.4 + 0.8,
      hue: i % 3 === 0 ? "244,63,94" : "16,185,129"
    }));
  }
  function step() {
    const w = canvas.offsetWidth, h = canvas.offsetHeight;
    ctx.clearRect(0, 0, w, h);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
    }
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        if (dist < 140) {
          ctx.strokeStyle = `rgba(16,185,129,${0.14 * (1 - dist / 140)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    for (const p of particles) {
      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.hue},0.7)`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  let rafId;
  function loop() { step(); rafId = requestAnimationFrame(loop); }
  resize(); seed();
  if (prefersReduced) step(); else loop();
  window.addEventListener("resize", () => { resize(); seed(); if (prefersReduced) step(); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) cancelAnimationFrame(rafId);
    else if (!prefersReduced) loop();
  });
})();
</script>
